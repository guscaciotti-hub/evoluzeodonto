name: Preview do site (GitHub Pages)

# Opcional: só roda quando acionado à mão. Para virar um link fixo que
# atualiza sozinho, basta habilitar o Pages uma vez em
# Settings > Pages > Source: "GitHub Actions" e então disparar este workflow.
on:
  workflow_dispatch:
  push:
    branches: [claude/exciting-maxwell-dlctrc]
    paths: ['public/**', '.github/workflows/pages.yml']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4

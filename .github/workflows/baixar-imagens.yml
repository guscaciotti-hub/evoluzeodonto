name: Baixar imagens externas

on:
  workflow_dispatch: # uso pontual: internaliza a foto do hero no repositório

permissions:
  contents: write

jobs:
  baixar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Baixar imagem do hero
        run: bash .github/scripts/baixar-imagens.sh

      - name: Commitar no branch de trabalho
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add public/assets/img
          if git diff --cached --quiet; then
            echo "Nada novo para commitar."
          else
            git commit -m "Adiciona foto do hero ao repositório (sem depender de CDN)"
            git push origin HEAD:${{ github.ref_name }}
          fi
